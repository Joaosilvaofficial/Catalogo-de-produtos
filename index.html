<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nodex Store</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="js/app.js" defer></script>

</head>

<body>
    <header>
        <div class="logo">
            <a href="#">
                <img src="assets/nodexstorelogo.jpg" alt="Nodex Store Logo">
            </a>
        </div>
        <nav class="filtros">

            <nav class="filtros">
                <input type="text" id="busca" placeholder="Pesquisar produto...">
                <select id="marca">
                    <option value="">Todas as marcas</option>
                </select>
                <select id="ordenar">
                    <option value="">Ordenar</option>
                    <option value="nome">Nome de A a Z</option>
                    <option value="menor">Menor Preço</option>
                    <option value="maior">Maior Preço</option>
                </select>
            </nav>
    </header>
    <main>
        <section id="produtos">

        </section>
        <nav id="paginacao">
            <ul> <!-- Adicionado aqui -->
                <li><a href="#" class="prev">&laquo; Anterior</a></li>
                <li><a href="#">1</a></li>
                <li><a href="#" class="active">2</a></li>
                <li><a href="#">3</a></li>
                <li><a href="#">4</a></li>
                <li><a href="#" class="next">Próximo &raquo;</a></li>
            </ul>
        </nav>

    </main>
    <footer>
        <ul>
            <li><a href="#">Termos de Uso</a></li>
            <li><a href="#">Politica de Privacidade</a></li>
        </ul>
        <p>&copy;2026. Nodex Store. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
